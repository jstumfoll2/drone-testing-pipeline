name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_sim:
        description: Run the PX4 + Gazebo smoke test
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * *"   # nightly simulation smoke test

jobs:
  unit:
    name: Unit tests (pure Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-contrib-python-headless numpy pyyaml pytest
      - name: dtp_perception
        working-directory: drone_ws/src/dtp_perception
        run: python -m pytest -q test
      - name: dtp_test
        working-directory: drone_ws/src/dtp_test
        run: python -m pytest -q test

  colcon:
    name: colcon build and test (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install tools and dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-vcstool python3-pytest \
            python3-opencv python3-yaml ros-jazzy-cv-bridge ros-jazzy-ros-gzharmonic
      - name: Import pinned sources
        run: |
          mkdir -p drone_ws/src/third_party
          vcs import --skip-existing drone_ws/src < dtp.repos
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd drone_ws
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --skip-keys "px4_msgs px4_ros2_cpp px4_ros2_py" || true
          colcon build --event-handlers console_cohesion+ \
            --packages-up-to dtp_bringup px4_msgs microxrcedds_agent
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd drone_ws
          colcon test --packages-select dtp_perception dtp_test dtp_bringup \
            --event-handlers console_direct+
          colcon test-result --verbose

  sim-smoke:
    name: Simulation smoke test (PX4 SITL + Gazebo)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_sim)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 Jazzy and Gazebo Harmonic
        run: |
          sudo apt-get update
          sudo apt-get install -y curl software-properties-common
          sudo add-apt-repository -y universe
          export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F\" '{print $4}')
          curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo $VERSION_CODENAME)_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-jazzy-ros-gzharmonic ros-jazzy-cv-bridge \
            python3-colcon-common-extensions python3-vcstool python3-rosdep python3-opencv python3-yaml
          sudo rosdep init || true
      - name: Cache PX4
        uses: actions/cache@v4
        with:
          path: ~/PX4-Autopilot
          key: px4-v1.17.0-${{ runner.os }}
      - name: Set up PX4 SITL
        run: bash scripts/setup_px4.sh ~/PX4-Autopilot
      - name: Build workspace
        run: bash scripts/bootstrap_ws.sh
      - name: Smoke test
        env:
          PX4_DIR: ~/PX4-Autopilot
        run: bash scripts/smoke_test.sh 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: results/smoke
